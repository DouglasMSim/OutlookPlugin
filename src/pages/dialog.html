<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Some attachments can't be included</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="dialog.js" defer></script>
</head>
<body class="dialog">
  <main>
    <h1>Some attachments can't be included</h1>
    <p id="summary">Some attachments can't be included in this reply.</p>
    <ul id="issues" class="issues" hidden></ul>
    <p id="available" class="muted"></p>
    <p class="muted">Nothing has been opened yet. Choose whether to open Reply All with the files that are available, or cancel.</p>
    <div class="actions">
      <button id="continue" class="primary" type="button" disabled>Continue</button>
      <button id="cancel" type="button" disabled>Cancel</button>
    </div>
  </main>
</body>
</html>
